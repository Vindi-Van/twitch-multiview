[versions]
agp = "9.4.1"
androidx-webkit = "1.17.1"
junit = "4.13.2"
json = "20260814"

[libraries]
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
junit = { module = "junit:junit", version.ref = "junit" }
# Android's org.json is a stub in local unit tests; the real one lets PageBridge and TwitchAccount be tested on the JVM.
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
