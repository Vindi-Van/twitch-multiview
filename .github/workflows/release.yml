name: Release

# Push a tag like v1.2.3 to publish a GitHub Release with the APK. See docs/RELEASING.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ github.ref_name }}
      # The maintainer's Twitch Client ID goes into released APKs only; it isn't in the repository.
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Decode the signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir out
          if [ "$HAS_SIGNING_KEY" = true ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew testDebugUnitTest assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "out/twitch-multiview-$APP_VERSION.apk"
          else
            # Without the signing secrets, publish a debug-signed APK as a prerelease (it can't update a signed install).
            ./gradlew testDebugUnitTest assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "out/twitch-multiview-$APP_VERSION-debug.apk"
          fi
          (cd out && sha256sum *.apk > SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          if [ "$HAS_SIGNING_KEY" != true ]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag --generate-notes --title "Multiview $GITHUB_REF_NAME" $flags
