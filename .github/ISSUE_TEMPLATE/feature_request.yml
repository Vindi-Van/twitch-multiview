name: Feature request
description: An idea that would make Multiview better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or situation, rather than the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How it could work, including which remote buttons it would use.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
